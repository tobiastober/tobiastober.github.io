    params:
      description: "Political scientist specializing in the political economy of structural change, quantitative analysis, and evidence-based decision-making."

      profileMode:
        enabled: true
        title: "Dr. Tobias Tober"
        subtitle: >-
          I am a political scientist specializing in the political economy of structural change. My work examines how major transformations such as technological change, European integration, globalization, and the climate transition affect societies, institutions, businesses, and public policy. I am currently a postdoctoral researcher at the [**University of Konstanz**](https://www.uni-konstanz.de/en/), where I am a member of the [**Department of Politics and Public Administration**](https://www.polver.uni-konstanz.de/en/busemeyer/team/team-prof-dr-marius-r-busemeyer/dr-tobias-tober/), the Cluster of Excellence [**The Politics of Inequality**](https://www.exc.uni-konstanz.de/ungleichheit/ueber-uns/personen/alle-clustermitglieder/tober-tobias/), and a ZENiT Fellow at the [**Zukunftskolleg**](https://www.uni-konstanz.de/zukunftskolleg/community/research-fellows/) (Institute for Advanced Study). My work combines quantitative analysis, comparative research, and the structured assessment of complex political and economic developments. I have led research projects, worked with international and cross-national data, and communicated evidence to academic, policy, and broader public audiences. My academic research has appeared in leading journals including the *British Journal of Political Science*, *Comparative Political Studies*, the *Journal of Politics*, and *Socio-Economic Review*.

