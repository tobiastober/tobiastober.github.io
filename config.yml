    params:
      description: "Politikwissenschaftler mit Schwerpunkt auf der politischen Ökonomie strukturellen Wandels, quantitativer Analyse und evidenzbasierter Entscheidungsfindung."

      profileMode:
        enabled: true
        title: "Dr. Tobias Tober"
        subtitle: >-
          Ich bin Politikwissenschaftler mit einem Schwerpunkt auf der politischen Ökonomie strukturellen Wandels. Meine Forschung untersucht, wie tiefgreifende Veränderungen — etwa technologischer Wandel, europäische Integration, Globalisierung und die Klimatransformation — Gesellschaften, Institutionen, Unternehmen und öffentliche Politik beeinflussen. Derzeit bin ich als Postdoktorand an der [**Universität Konstanz**](https://www.uni-konstanz.de/) tätig. Dort bin ich Mitglied des [**Fachbereichs Politik- und Verwaltungswissenschaft**](https://www.polver.uni-konstanz.de/busemeyer/team/team-prof-dr-marius-r-busemeyer/dr-tobias-tober/), des Exzellenzclusters [**The Politics of Inequality**](https://www.exc.uni-konstanz.de/ungleichheit/) und ZENiT Fellow am [**Zukunftskolleg**](https://www.uni-konstanz.de/zukunftskolleg/) (Institute for Advanced Study). Meine Arbeiten verbinden quantitative Analyse, vergleichende Forschung und die strukturierte Bewertung komplexer politischer und wirtschaftlicher Entwicklungen. Ich habe Forschungsprojekte geleitet, mit internationalen und länderübergreifenden Daten gearbeitet und wissenschaftliche Erkenntnisse für akademische, politische und breitere öffentliche Zielgruppen aufbereitet. Meine wissenschaftlichen Beiträge sind unter anderem im *British Journal of Political Science*, in *Comparative Political Studies* und im *Journal of Politics* erschienen. Darüber hinaus habe ich Forschungsergebnisse unter anderem im *LSE EUROPP Blog*, in Policy-Papieren und in der *WirtschaftsWoche* erläutert.

        imageUrl: "pic.png"
        imageWidth: 170
        imageHeight: 170
        imageTitle: "Tobias Tober"

