    title: "Dr. Tobias Tober"
    subtitle: >-
      I am a postdoctoral researcher in political science at the [**University of Konstanz**](https://www.uni-konstanz.de/en/). I am a member of the [**Department of Politics and Public Administration**](https://www.polver.uni-konstanz.de/en/busemeyer/team/team-prof-dr-marius-r-busemeyer/dr-tobias-tober/), the Cluster of Excellence [**The Politics of Inequality**](https://www.exc.uni-konstanz.de/ungleichheit/ueber-uns/personen/alle-clustermitglieder/tober-tobias/), and a ZENiT Fellow at the [**Zukunftskolleg**](https://www.uni-konstanz.de/zukunftskolleg/community/research-fellows/) (Institute for Advanced Study). My research examines the political implications of large-scale structural transformations, including European integration, globalization, technological change, and climate change, from a comparative perspective. I am particularly interested in how these transformations reshape the political economy of advanced democracies. My research in this area addresses issues such as social policy, business interests, inequality, and subjective well-being. In addition, I have a strong interest in applied quantitative methods and Bayesian statistics. My work has appeared in leading journals including the *British Journal of Political Science*, *Comparative Political Studies*, the *Journal of Politics*, and *Socio-Economic Review*.

