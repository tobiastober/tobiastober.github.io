      description: "Ich bin Postdoktorand in der Politikwissenschaft an der Universität Konstanz und Mitglied des Fachbereichs Politik- und Verwaltungswissenschaft, des Exzellenzclusters The Politics of Inequality sowie ZENiT Fellow am Zukunftskolleg."

      profileMode:
        enabled: true
        title: "Dr. Tobias Tober"
        subtitle: >-
          Ich bin Postdoktorand in der Politikwissenschaft an der [**Universität Konstanz**](https://www.uni-konstanz.de/). Ich bin Mitglied des [**Fachbereichs Politik- und Verwaltungswissenschaft**](https://www.polver.uni-konstanz.de/busemeyer/team/team-prof-dr-marius-r-busemeyer/dr-tobias-tober/), des Exzellenzclusters [**The Politics of Inequality**](https://www.exc.uni-konstanz.de/ungleichheit/ueber-uns/personen/alle-clustermitglieder/tober-tobias/) und ZENiT Fellow am [**Zukunftskolleg**](https://www.uni-konstanz.de/zukunftskolleg/) (Institute for Advanced Study). Meine Forschung untersucht aus vergleichender Perspektive die politischen Folgen tiefgreifender struktureller Veränderungen wie der europäischen Integration, der Globalisierung, des technologischen Wandels und des Klimawandels. Besonders interessiert mich, wie diese Veränderungen die politische Ökonomie fortgeschrittener Demokratien prägen. In diesem Zusammenhang beschäftige ich mich unter anderem mit Sozialpolitik, Unternehmensinteressen, Ungleichheit und subjektivem Wohlbefinden. Darüber hinaus interessiere ich mich für angewandte quantitative Methoden und Bayes-Statistik. Meine Arbeiten sind in führenden Fachzeitschriften wie dem *British Journal of Political Science*, *Comparative Political Studies*, dem *Journal of Politics* und *Socio-Economic Review* erschienen.

        imageUrl: "pic.png"
        imageWidth: 170
        imageHeight: 170
        imageTitle: "Tobias Tober"

